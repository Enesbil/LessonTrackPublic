[project]
name = "lessontrack"
version = "0.1.0"
description = "English2Success weekly tutor reporting with traceable, resumable processing"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gspread>=6.2.1,<7",
    "requests>=2.32.5,<3",
    "google-auth>=2.40.3,<3",
    "google-auth-httplib2>=0.2.0,<1",
    "google-api-python-client>=2.183.0,<3",
    "httplib2>=0.31.0,<1",
]

[dependency-groups]
dev = ["ruff>=0.12,<1", "pyyaml>=6,<7"]

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["apps-script"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
